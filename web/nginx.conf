# 该文件会作为 nginx 模板被渲染（/etc/nginx/templates/default.conf.template）
# ${BACKEND_ORIGIN} 由容器环境变量注入，默认值见 Dockerfile

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 压缩
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # 前端路由（react-router）回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # vite 产物带 hash，可长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 不缓存，保证发版后立即生效
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 后端接口代理
    # vite dev 中通过 proxy + rewrite 去掉 /api 前缀；这里用 proxy_pass 末尾的 "/" 达到同样效果
    # 例如 /api/auth/login -> ${BACKEND_ORIGIN}/auth/login
    location /api/ {
        proxy_pass ${BACKEND_ORIGIN}/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /api/dify/chat-messages 为 SSE 流式响应，需关闭缓冲并放宽超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
